[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-mini"
version = "0.1.0"
description = "Offline-first agricultural AI proof-of-working scaffold"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
model = ["torch>=2.2,<3"]

[tool.setuptools]
packages = ["agri", "tokenizer", "models", "models.transformer"]
py-modules = ["soil_tokenizer"]
